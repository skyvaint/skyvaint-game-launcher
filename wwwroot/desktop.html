<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skyvaint desktop</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body { font: 15px/1.3 'Segoe UI Variable Display', 'Segoe UI', sans-serif; color: #f5efee; --accent: #ff1f1f; --accent2: #ff4d3d; }
  body.wall { background: #000; }
  /* wallpaper */
  #wp, #wp > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wp img, #wp video { object-fit: var(--fit, cover); }
  #wp canvas { display: block; }
  #dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  /* widgets */
  .w { position: absolute; transform-origin: 0 0; box-sizing: border-box; padding: 16px 18px; border-radius: var(--r, 16px);
    color: var(--tc, #f5efee); cursor: default; transition: box-shadow .2s, filter .2s; }
  .w.glass { background: rgba(14, 10, 10, .62); backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .w.accent { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .w.custom { background: var(--bg); }
  .w.none { padding: 6px; }
  .w.bare { padding: 0; background: none; border: 0; box-shadow: none; }
  .wk-card button { pointer-events: auto; }
  .unlocked .wk-card button { pointer-events: none; }
  .w.unlocked { outline: 2px dashed rgba(255, 255, 255, .55); outline-offset: 4px; cursor: grab; }
  .w.unlocked:active { cursor: grabbing; }
  .w .tag { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .7; }
  .w .big { font-size: 54px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .w .mid { font-size: 22px; font-weight: 600; }
  .w .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); margin: 6px 0 10px; overflow: hidden; }
  .w .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .6s; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform .18s, filter .18s; }
  .app img, .app .ph { width: var(--px, 64px); height: var(--px, 64px); border-radius: var(--ir, 16px); object-fit: cover; background: rgba(255, 255, 255, .08); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--px, 64px) * .4); }
  .app span { font-size: 12px; max-width: calc(var(--px, 64px) + 30px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px #000; }
  .hv-glow .app:hover img, .hv-glow .app:hover .ph { box-shadow: 0 0 0 2px var(--accent), 0 0 24px var(--accent); }
  .hv-lift .app:hover { transform: translateY(-6px); }
  .hv-grow .app:hover { transform: scale(1.1); }
  .grid { display: grid; grid-template-columns: repeat(4, auto); gap: 14px; }
  .unlocked .app { pointer-events: none; }
  .tools { position: absolute; top: -34px; right: 0; display: none; gap: 6px; }
  .unlocked .tools { display: flex; }
  .tools button { font: 600 11px 'Segoe UI', sans-serif; letter-spacing: .1em; background: rgba(0, 0, 0, .7); color: #fff; border: 1px solid rgba(255, 255, 255, .3); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="wp"></div>
<div id="dim"></div>
<div id="ws"></div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@900&family=JetBrains+Mono:wght@500&display=swap">
<script src="js/aurora.js"></script>
<script src="js/widgetkit.js"></script>
<script src="js/desktop.js"></script>
</body>
</html>
